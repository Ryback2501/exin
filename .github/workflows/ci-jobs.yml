name: CI jobs

# Reusable CI. Called by pr-work-to-dev.yml and pr-dev-to-main.yml.
# Generalized from Mockscii. The kick-off skill resolves every {{placeholder}}
# from the chosen stack adapter and DELETES whole jobs that don't apply to the
# project (e.g. a library with no docker image drops the `docker` job; a CLI may
# drop `e2e`). Keep every job that survives wired into branch-protection's
# required checks.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: "npm ci"
      - run: "npm run lint"

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: "npm ci"
      - run: "npm run test"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: "npm ci"
      - run: "npm run build"
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist

  # --- optional: delete if the project ships no container image ---
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t exin:ci .
      - name: Run container
        run: docker run -d --name exin -p 8080:80 exin:ci
      - name: Healthcheck
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "container is serving"; exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs exin; exit 1
      - name: Stop container
        if: always()
        run: docker rm -f exin || true

  # --- optional: secret + dependency scan. Toggled by the SECURITY_SCAN repo
  #     variable (flip it on without editing this file). When enabled, kick-off
  #     adds `CI / security` to the branch-protection required checks so a finding
  #     blocks merge. Deterministic tooling — no LLM in the loop. ---
  security:
    name: security
    runs-on: ubuntu-latest
    if: vars.SECURITY_SCAN == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Personal accounts need no license; GitHub *orgs* require GITLEAKS_LICENSE.
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Dependency vulnerability audit
        run: |
          npm audit --audit-level=high
